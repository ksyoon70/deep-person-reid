model:
  name: 'osnet_x1_0'
  pretrained: True

data:
  type: 'image'
  sources: ['veri']
  targets: ['veri']
  height: 256
  width: 256
  combineall: False
  transforms: ['random_flip']
  save_dir: 'log/osnet_x1_0_veri_softmax'

loss:
  name: 'softmax'
  softmax:
    label_smooth: True

train:
  optim: 'amsgrad'
  lr: 0.0015
  max_epoch: 70
  batch_size: 64
  fixbase_epoch: 10
  open_layers: ['classifier']
  lr_scheduler: 'single_step'
  stepsize: [60]

test:
  batch_size: 64
  dist_metric: 'euclidean'
  normalize_feature: False
  evaluate: False
  eval_freq: -1
  rerank: False